name: Validate OpenSpec

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@latest

      - name: Register OpenSpec store
        run: openspec store register . --id rhcl-sdd --yes

      - name: Doctor
        run: openspec doctor --store rhcl-sdd

      - name: Validate specs
        run: openspec validate --all --store rhcl-sdd
